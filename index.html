<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Video Player</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #player-container { width: 100%; max-width: 800px; }
        iframe { width: 100%; height: 450px; border: none; }
        #controls { margin-top: 10px; }
        button { cursor: pointer; padding: 10px; }
    </style>
</head>
<body>

<div id="player-container">
    <iframe src="https://www.youtube-nocookie.com/embed/WB1l9MQRi2s?autoplay=1&modestbranding=1" allowfullscreen></iframe>
</div>

<div id="controls">
    <button id="fsbutton"><i class="material-icons">fullscreen</i></button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    let iframe = document.getElementsByTagName('iframe')[0];
    let fsButton = document.getElementById('fsbutton');

    fsButton.addEventListener('click', () => {
        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
            else if (document.documentElement.mozRequestFullScreen) document.documentElement.mozRequestFullScreen();
            else if (document.documentElement.msRequestFullscreen) document.documentElement.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    }, false);
});
</script>
</body>
</html>
