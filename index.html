<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>YouTube Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #header { padding: 10px 15px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; height: 50px; flex-shrink: 0; }
    #main { display: flex; flex: 1; height: calc(100vh - 50px); overflow: hidden; position: relative; }
    
    #player-area { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #000; }
    
    #search-area { width: 340px; background: #181818; border-left: 1px solid #333; display: flex; flex-direction: column; height: 100%; flex-shrink: 0; transition: transform 0.3s ease; z-index: 10; }
    #search-area.hidden { transform: translateX(100%); position: absolute; right: 0; top: 0; }
    
    .controls { padding: 8px 12px; background: #252525; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #333; font-size: 13px; flex-wrap: wrap; flex-shrink: 0; }
    .switch-container { display: flex; align-items: center; gap: 8px; }
    .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #2196F3; }
    input:checked + .slider:before { transform: translateX(20px); }
    
    .notice { font-size: 11px; color: #aaa; width: 100%; margin-top: 2px; }
    
    button { background: #333; color: white; border: 1px solid #555; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
    button:hover { background: #444; }

    #search-box-wrap { padding: 10px; background: #222; border-bottom: 1px solid #333; flex-shrink: 0; }
    #history-container { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; }
    .history-section { margin-bottom: 15px; }
    .history-section h4 { margin: 0 0 5px 0; color: #8ab4f8; font-size: 12px; border-bottom: 1px solid #444; padding-bottom: 3px; }
    .history-list { list-style: none; padding: 0; margin: 0; }
    .history-list li { padding: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-list a { color: #ccc; text-decoration: none; }
    .history-list a:hover { text-decoration: underline; color: #fff; }
</style>
</head>
<body>

<div id="header">
    <strong>YouTube Viewer</strong>
    <div>
        <button onclick="clearAllHistories()" style="margin-right: 8px; background: #5a2a2a;">履歴全削除</button>
        <button onclick="toggleSearch()">検索枠 表示/非表示</button>
    </div>
</div>

<div id="main">
    <div id="player-area">
        <div class="controls">
            <div class="switch-container">
                <span>通常API</span>
                <label class="switch">
                    <input type="checkbox" id="mode-switch">
                    <span class="slider"></span>
                </label>
                <span>No-Cookie</span>
            </div>
            <button id="fs-btn">全画面</button>
            <div class="notice">※No-Cookieモードにすると、プライバシー保護の仕様により広告の挙動が変化・増加する場合があります。</div>
        </div>
        <iframe id="video-frame" src="about:blank" allowfullscreen></iframe>
    </div>

    <div id="search-area">
        <div id="search-box-wrap">
            <script>
              (function() {
                var cx = '005510692277321758648:r0nge9ptruy';
                var gcse = document.createElement('script');
                gcse.type = 'text/javascript';
                gcse.async = true;
                gcse.src = 'https://cse.google.com/cse.js?cx=' + cx;
                var s = document.getElementsByTagName('script')[0];
                s.parentNode.insertBefore(gcse, s);
              })();
            </script>
            <gcse:searchbox></gcse:searchbox>
        </div>
        <div id="history-container">
            <div class="history-section">
                <h4>動画再生履歴</h4>
                <ul id="video-history-list" class="history-list"></ul>
            </div>
            <div class="history-section">
                <h4>検索履歴</h4>
                <ul id="search-history-list" class="history-list"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    const frame = document.getElementById('video-frame');
    const modeSwitch = document.getElementById('mode-switch');
    const searchArea = document.getElementById('search-area');
    const videoHistoryList = document.getElementById('video-history-list');
    const searchHistoryList = document.getElementById('search-history-list');

    const savedNoCookie = localStorage.getItem('noCookie');
    modeSwitch.checked = savedNoCookie === 'true';

    modeSwitch.addEventListener('change', () => {
        localStorage.setItem('noCookie', modeSwitch.checked);
    });

    function toggleSearch() {
        searchArea.classList.toggle('hidden');
    }

    function updateVideoSrc(url, videoId) {
        if (!videoId) return;
        const isNoCookie = modeSwitch.checked;
        const base = isNoCookie ? 'https://www.youtube-nocookie.com/embed/' : 'https://www.youtube.com/embed/';
        frame.src = base + videoId + '?autoplay=1&modestbranding=1';
        saveVideoHistory(url, videoId);
    }

    function saveVideoHistory(url, videoId) {
        let history = JSON.parse(localStorage.getItem('videoHistory') || '[]');
        history = history.filter(item => item.videoId !== videoId);
        history.unshift({ url, videoId, time: new Date().toLocaleTimeString() });
        if (history.length > 30) history.pop();
        localStorage.setItem('videoHistory', JSON.stringify(history));
        renderHistories();
    }

    function saveSearchHistory(query) {
        if (!query.trim()) return;
        let history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
        history = history.filter(item => item !== query);
        history.unshift(query);
        if (history.length > 30) history.pop();
        localStorage.setItem('searchHistory', JSON.stringify(history));
        renderHistories();
    }

    function clearAllHistories() {
        if (confirm('すべての再生履歴と検索履歴を削除しますか？')) {
            localStorage.removeItem('videoHistory');
            localStorage.removeItem('searchHistory');
            renderHistories();
        }
    }

    function renderHistories() {
        const vHistory = JSON.parse(localStorage.getItem('videoHistory') || '[]');
        videoHistoryList.innerHTML = '';
        vHistory.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="#" onclick="updateVideoSrc('${item.url}', '${item.videoId}'); return false;" title="${item.url}">[${item.time}] ${item.videoId}</a>`;
            videoHistoryList.appendChild(li);
        });

        const sHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
        searchHistoryList.innerHTML = '';
        sHistory.forEach(query => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="#" onclick="executeSearchQuery('${query}'); return false;">${query}</a>`;
            searchHistoryList.appendChild(li);
        });
    }

    function executeSearchQuery(query) {
        const input = document.querySelector('input.gsc-input');
        if (input) {
            input.value = query;
            const btn = document.querySelector('button.gsc-search-button');
            if (btn) btn.click();
        }
    }

    document.getElementById('fs-btn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    });

    document.addEventListener('click', e => {
        const target = e.target.closest('a');
        if (!target) return;
        const href = target.href;
        if (href && (href.includes('youtube.com/watch') || href.includes('youtu.be/'))) {
            e.preventDefault();
            let videoId = '';
            if (href.includes('v=')) {
                videoId = new URL(href).searchParams.get('v');
            } else if (href.includes('youtu.be/')) {
                videoId = href.split('youtu.be/')[1]?.split('?')[0];
            }
            updateVideoSrc(href, videoId);
        }
    });

    document.addEventListener('submit', e => {
        const input = e.target.querySelector('input.gsc-input');
        if (input && input.value) {
            saveSearchHistory(input.value);
        }
    });

    renderHistories();
</script>
</body>
</html>
