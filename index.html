<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114">
<title>YouTube Viewer</title>
<style>
:root {
    color-scheme: dark;
    --bg: #101114;
    --panel: #191a1f;
    --panel-raised: #202127;
    --line: #30313a;
    --text: #f3f4f6;
    --muted: #a4a6b0;
    --accent: #6b9cff;
    --accent-hover: #82aaff;
    --accent-soft: rgba(107,156,255,.16);
    --danger: #ff6868;
    --radius: 14px;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body {
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
}
button, input { font: inherit; }
button {
    color: var(--text);
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 12px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
}
button:hover { background: #2a2c34; border-color: #444752; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.active { color: #dce8ff; background: var(--accent-soft); border-color: var(--accent); }
button.danger { color: var(--danger); }

/* Header */
#header {
    min-height: 66px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
}
.logo { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-size: 16px; font-weight: 750; letter-spacing: -.02em; }
.logo-mark { width: 29px; height: 21px; position: relative; flex: 0 0 auto; border-radius: 7px; background: #ff3b3b; }
.logo-mark::after { content: ""; position: absolute; left: 12px; top: 5px; border-left: 8px solid white; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
#url-form { width: min(720px, 100%); display: flex; margin: 0 auto; }
#url-input {
    flex: 1;
    min-width: 0;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-right: 0;
    border-radius: 999px 0 0 999px;
    color: var(--text);
    background: var(--bg);
}
#url-input::placeholder { color: #858792; }
#url-form button { min-width: 78px; border-radius: 0 999px 999px 0; border-color: var(--accent); background: var(--accent); color: #101114; font-weight: 700; }
#url-form button:hover { background: var(--accent-hover); }
#toggle-side-btn { white-space: nowrap; }

/* Main player and sidebar */
#main { min-height: 0; flex: 1; display: flex; gap: 16px; padding: 16px; }
#player-area { min-width: 0; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 12px; }
#player-wrap {
    position: relative;
    min-height: 0;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #050506;
}
#player-box { width: 100%; height: 100%; }
#player-box.shorts { width: auto; max-width: 100%; aspect-ratio: 9 / 16; }
#video-frame { display: block; width: 100%; height: 100%; border: 0; background: #000; }
#empty { position: absolute; max-width: 360px; padding: 24px; color: var(--muted); text-align: center; pointer-events: none; line-height: 1.8; }
#empty b { display: block; margin-bottom: 6px; color: var(--text); font-size: 18px; }
#player-wrap.has-video #empty { display: none; }
#toolbar {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    flex: 0 0 auto;
}
.seg { display: inline-flex; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; }
.seg button { border: 0; border-radius: 0; padding: 7px 11px; background: transparent; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.active { background: var(--accent-soft); color: #dce8ff; }
.toolbar-spacer { flex: 1; }
#open-link { padding: 7px 8px; color: var(--accent); text-decoration: none; white-space: nowrap; }
#open-link:hover { text-decoration: underline; }
#open-link.hidden { display: none; }
#hint { width: 100%; color: var(--muted); font-size: 12px; }

#side {
    width: 380px;
    min-width: 300px;
    min-height: 0;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
}
#side.hidden { display: none; }
#tabs { display: flex; flex: 0 0 auto; padding: 5px; gap: 4px; border-bottom: 1px solid var(--line); }
#tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 10px 8px; font-weight: 650; }
#tabs button:hover { background: var(--panel-raised); }
#tabs button.active { color: var(--text); background: var(--panel-raised); box-shadow: inset 0 -2px var(--accent); }
.pane { display: none; min-height: 0; flex: 1; overflow-y: auto; padding: 14px; }
.pane.show { display: block; }

/* History and search */
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 0 10px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.section-title button { padding: 5px 9px; font-size: 12px; }
.video-list { display: grid; gap: 7px; margin: 0 0 22px; padding: 0; list-style: none; }
.video-card { display: flex; align-items: center; gap: 11px; padding: 7px; border-radius: 10px; color: var(--text); text-decoration: none; }
.video-card:hover { background: var(--panel-raised); }
.thumb { position: relative; width: 112px; flex: 0 0 auto; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 7px; background: #050506; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; right: 4px; bottom: 4px; padding: 1px 5px; border-radius: 4px; background: #e83232; font-size: 10px; font-weight: 700; }
.video-meta { min-width: 0; }
.video-meta .vid { overflow: hidden; color: var(--text); font: 12px ui-monospace, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
.video-meta .time { margin-top: 4px; color: var(--muted); font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
.chip { padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-raised); color: var(--text); font-size: 12px; text-decoration: none; }
.chip:hover { border-color: var(--accent); }
.none { padding: 10px 4px 16px; color: var(--muted); font-size: 13px; }

/* Google Custom Search dark theme */
.gsc-control-cse { border: 0 !important; padding: 0 !important; background: transparent !important; font-family: inherit !important; }
.gsc-search-box, table.gsc-search-box td { border: 0 !important; }
input.gsc-input { padding: 7px 9px !important; border: 1px solid var(--line) !important; border-radius: 8px !important; background: var(--bg) !important; color: #fff !important; }
.gsc-search-button-v2 { padding: 8px 12px !important; border: 1px solid var(--accent) !important; border-radius: 8px !important; background: var(--accent) !important; }
.gsc-search-button-v2 svg { fill: #fff !important; }
.gsc-results-wrapper-visible, .gsc-results-root, .gsc-webResult.gsc-result { border: 0 !important; background: transparent !important; }
.gsc-webResult.gsc-result { padding: 10px 4px !important; border-bottom: 1px solid var(--line) !important; }
.gs-webResult .gs-title, .gs-webResult .gs-title * { color: #8ab4f8 !important; font-size: 15px !important; }
.gs-webResult .gs-snippet, .gs-webResult .gs-snippet * { color: #c4c4cf !important; }
.gs-webResult div.gs-visibleUrl { color: #7fd18c !important; }
.gsc-cursor-page { border-radius: 6px; background: var(--panel-raised) !important; color: #cfd0dc !important; }
.gsc-cursor-current-page { background: var(--accent) !important; color: #fff !important; }
.gsc-adBlock, .gsc-above-wrapper-area { display: none !important; }

@media (max-width: 900px) {
    body { overflow: auto; min-height: 100%; height: auto; }
    #header { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
    #url-form { order: 3; flex-basis: 100%; max-width: none; }
    #main { flex-direction: column; padding: 10px; gap: 10px; }
    #player-area { flex: none; height: min(62vh, 620px); min-height: 280px; }
    #main.no-side #player-area { height: calc(100vh - 100px); }
    #side { width: 100%; min-width: 0; min-height: 340px; flex: 1 0 340px; }
}
@media (max-width: 520px) {
    #header { gap: 8px; }
    .logo { font-size: 14px; }
    #toggle-side-btn { margin-left: auto; padding: 7px 9px; font-size: 12px; }
    #main { padding: 8px; }
    #player-area { height: 54vh; min-height: 250px; }
    #toolbar { gap: 6px; padding: 8px; }
    .seg button { padding: 7px 8px; font-size: 12px; }
    #toolbar > button { padding: 7px 9px; font-size: 12px; }
    .thumb { width: 96px; }
}
</style>
<script>
    // Google Custom Search callback; the function is called after the app script loads.
    window.__gcse = {
        searchCallbacks: {
            web: { starting: function (gname, query) {
                if (typeof window.saveSearchHistory === 'function') window.saveSearchHistory(query);
                return query;
            } }
        }
    };
</script>
<script async src="https://cse.google.com/cse.js?cx=005510692277321758648:r0nge9ptruy"></script>
</head>
<body>
<header id="header">
    <div class="logo"><span class="logo-mark" aria-hidden="true"></span><span>YouTube Viewer</span></div>
    <form id="url-form" aria-label="動画を再生">
        <input id="url-input" type="text" placeholder="YouTubeのURLまたは動画IDを貼り付け" autocomplete="off" aria-label="YouTubeのURLまたは動画ID">
        <button type="submit">再生</button>
    </form>
    <button id="toggle-side-btn" class="active" type="button" aria-expanded="true">検索・履歴</button>
</header>
<main id="main">
    <section id="player-area" aria-label="動画プレーヤー">
        <div id="player-wrap">
            <div id="empty"><b>動画を再生</b>上の入力欄にYouTubeのURLか動画IDを貼り付けるか、右側の検索から動画を選んでください。</div>
            <div id="player-box">
                <iframe id="video-frame" src="about:blank" title="YouTube player" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
        <div id="toolbar" aria-label="プレーヤー設定">
            <div class="seg" aria-label="表示比率">
                <button id="shape-normal" type="button">通常</button>
                <button id="shape-shorts" type="button">縦長</button>
            </div>
            <div class="seg" aria-label="埋め込みモード">
                <button id="mode-normal" type="button">通常</button>
                <button id="mode-nocookie" type="button">No-Cookie</button>
            </div>
            <button id="loop-btn" type="button">ループ</button>
            <span class="toolbar-spacer"></span>
            <a id="open-link" class="hidden" target="_blank" rel="noopener noreferrer">YouTubeで開く ↗</a>
            <button id="fs-btn" type="button">全画面</button>
            <div id="hint" role="status">埋め込み禁止の動画は再生できません。その場合は「YouTubeで開く」から視聴してください。</div>
        </div>
    </section>
    <aside id="side" aria-label="検索と履歴">
        <nav id="tabs" aria-label="サイドパネル">
            <button id="tab-search" class="active" type="button" aria-selected="true">検索</button>
            <button id="tab-history" type="button" aria-selected="false">履歴</button>
        </nav>
        <section id="pane-search" class="pane show" aria-label="YouTube動画検索">
            <div class="gcse-search" data-gname="main"></div>
        </section>
        <section id="pane-history" class="pane" aria-label="再生履歴と検索履歴">
            <div class="section-title"><span>動画再生履歴</span><button class="danger" id="clear-video-btn" type="button">削除</button></div>
            <ul id="video-history-list" class="video-list"></ul>
            <div class="section-title"><span>検索履歴</span><button class="danger" id="clear-search-btn" type="button">削除</button></div>
            <div id="search-history-list" class="chips"></div>
        </section>
    </aside>
</main>
<script>
    const $ = id => document.getElementById(id);
    const frame = $('video-frame');
    const playerBox = $('player-box');
    const playerWrap = $('player-wrap');
    const side = $('side');

    function load(key, fallback) {
        try {
            const value = JSON.parse(localStorage.getItem(key));
            return value === null || value === undefined ? fallback : value;
        } catch (_) { return fallback; }
    }
    function save(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
    }

    let current = null;
    let noCookie = load('noCookie', false) === true;
    let loopOn = load('loop', false) === true;
    let shortsDefault = load('shortsMode', false) === true;

    function refreshControls() {
        const vertical = current ? current.short : shortsDefault;
        $('shape-normal').classList.toggle('active', !vertical);
        $('shape-shorts').classList.toggle('active', vertical);
        $('mode-normal').classList.toggle('active', !noCookie);
        $('mode-nocookie').classList.toggle('active', noCookie);
        $('loop-btn').classList.toggle('active', loopOn);
        playerBox.classList.toggle('shorts', vertical);
        const sideVisible = !side.classList.contains('hidden');
        $('toggle-side-btn').classList.toggle('active', sideVisible);
        $('toggle-side-btn').setAttribute('aria-expanded', String(sideVisible));
        $('main').classList.toggle('no-side', !sideVisible);
    }

    function setShape(vertical) {
        shortsDefault = vertical;
        save('shortsMode', vertical);
        if (current) current.short = vertical;
        refreshControls();
    }
    $('shape-normal').addEventListener('click', () => setShape(false));
    $('shape-shorts').addEventListener('click', () => setShape(true));

    function setMode(useNoCookie) {
        if (noCookie === useNoCookie) return;
        noCookie = useNoCookie;
        save('noCookie', noCookie);
        refreshControls();
        if (current) play(current.id, current.short);
    }
    $('mode-normal').addEventListener('click', () => setMode(false));
    $('mode-nocookie').addEventListener('click', () => setMode(true));

    $('loop-btn').addEventListener('click', () => {
        loopOn = !loopOn;
        save('loop', loopOn);
        refreshControls();
        if (current) play(current.id, current.short);
    });

    function parseYouTube(input) {
        if (typeof input !== 'string' || !input.trim()) return null;
        input = input.trim();
        if (/^[\w-]{11}$/.test(input)) return { id: input, short: shortsDefault };
        let url;
        try { url = new URL(/^https?:\/\//i.test(input) ? input : 'https://' + input); }
        catch (_) { return null; }

        if (/(^|\.)google\./i.test(url.hostname) && url.pathname === '/url') {
            const target = url.searchParams.get('q') || url.searchParams.get('url');
            return target ? parseYouTube(target) : null;
        }

        const host = url.hostname.toLowerCase().replace(/^www\.|^m\./, '');
        const parts = url.pathname.split('/').filter(Boolean);
        let id = null;
        let short = false;
        if (host === 'youtu.be') {
            id = parts[0];
        } else if (['youtube.com', 'youtube-nocookie.com', 'music.youtube.com'].includes(host)) {
            if (parts[0] === 'watch') id = url.searchParams.get('v');
            else if (['shorts', 'embed', 'live', 'v'].includes(parts[0])) id = parts[1];
            short = parts[0] === 'shorts';
        }
        return id && /^[\w-]{11}$/.test(id) ? { id, short } : null;
    }

    function play(id, vertical) {
        if (!id || !/^[\w-]{11}$/.test(id)) return;
        current = { id, short: !!vertical };
        shortsDefault = current.short;
        save('shortsMode', shortsDefault);

        const base = noCookie ? 'https://www.youtube-nocookie.com/embed/' : 'https://www.youtube.com/embed/';
        const params = new URLSearchParams({ autoplay: '1', modestbranding: '1', rel: '0', playsinline: '1' });
        if (loopOn) {
            params.set('loop', '1');
            params.set('playlist', id);
        }
        frame.src = base + encodeURIComponent(id) + '?' + params.toString();

        const link = $('open-link');
        link.href = 'https://www.youtube.com/' + (current.short ? 'shorts/' : 'watch?v=') + encodeURIComponent(id);
        link.classList.remove('hidden');
        playerWrap.classList.add('has-video');
        save('lastVideo', current);
        saveVideoHistory(id, current.short);
        refreshControls();
    }

    $('url-form').addEventListener('submit', event => {
        event.preventDefault();
        const parsed = parseYouTube($('url-input').value);
        if (!parsed) {
            alert('YouTubeのURLまたは11文字の動画IDを入力してください。');
            return;
        }
        play(parsed.id, parsed.short);
        $('url-input').value = '';
    });

    function saveVideoHistory(id, short) {
        let history = load('videoHistory', []);
        if (!Array.isArray(history)) history = [];
        history = history.filter(item => item && item.id !== id);
        history.unshift({ id, short: !!short, time: new Date().toLocaleString('ja-JP') });
        save('videoHistory', history.slice(0, 30));
        renderHistories();
    }

    window.saveSearchHistory = function (query) {
        if (typeof query !== 'string' || !query.trim()) return;
        let history = load('searchHistory', []);
        if (!Array.isArray(history)) history = [];
        history = history.filter(item => item !== query);
        history.unshift(query);
        save('searchHistory', history.slice(0, 30));
        renderHistories();
    };

    $('clear-video-btn').addEventListener('click', () => {
        if (confirm('動画再生履歴をすべて削除しますか？')) {
            save('videoHistory', []);
            renderHistories();
        }
    });
    $('clear-search-btn').addEventListener('click', () => {
        if (confirm('検索履歴をすべて削除しますか？')) {
            save('searchHistory', []);
            renderHistories();
        }
    });

    function renderHistories() {
        const videoList = $('video-history-list');
        videoList.textContent = '';
        const storedVideos = load('videoHistory', []);
        const videos = Array.isArray(storedVideos) ? storedVideos.filter(item => item && /^[\w-]{11}$/.test(item.id)) : [];
        if (!videos.length) {
            const empty = document.createElement('li');
            empty.className = 'none';
            empty.textContent = 'まだ再生した動画はありません。';
            videoList.appendChild(empty);
        }
        videos.forEach(item => {
            const li = document.createElement('li');
            const link = document.createElement('a');
            link.href = '#';
            link.className = 'video-card';
            link.addEventListener('click', event => {
                event.preventDefault();
                play(item.id, item.short);
            });
            const thumb = document.createElement('div');
            thumb.className = 'thumb';
            const img = document.createElement('img');
            img.src = 'https://i.ytimg.com/vi/' + encodeURIComponent(item.id) + '/mqdefault.jpg';
            img.loading = 'lazy';
            img.alt = '';
            thumb.appendChild(img);
            if (item.short) {
                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = 'Shorts';
                thumb.appendChild(badge);
            }
            const meta = document.createElement('div');
            meta.className = 'video-meta';
            const videoId = document.createElement('div');
            videoId.className = 'vid';
            videoId.textContent = item.id;
            const time = document.createElement('div');
            time.className = 'time';
            time.textContent = item.time || '';
            meta.append(videoId, time);
            link.append(thumb, meta);
            li.appendChild(link);
            videoList.appendChild(li);
        });

        const searchList = $('search-history-list');
        searchList.textContent = '';
        const storedSearches = load('searchHistory', []);
        const searches = Array.isArray(storedSearches) ? storedSearches.filter(item => typeof item === 'string') : [];
        if (!searches.length) {
            const empty = document.createElement('div');
            empty.className = 'none';
            empty.textContent = 'まだ検索していません。';
            searchList.appendChild(empty);
        }
        searches.forEach(query => {
            const link = document.createElement('a');
            link.href = '#';
            link.className = 'chip';
            link.textContent = query;
            link.addEventListener('click', event => {
                event.preventDefault();
                executeSearchQuery(query);
            });
            searchList.appendChild(link);
        });
    }

    function executeSearchQuery(query) {
        showTab('search');
        try {
            const element = window.google && google.search && google.search.cse.element.getElement('main');
            if (element) {
                element.execute(query);
                return;
            }
        } catch (_) {}
        const input = document.querySelector('input.gsc-input');
        if (input) {
            input.value = query;
            const button = document.querySelector('button.gsc-search-button');
            if (button) button.click();
        }
    }

    // Play YouTube results in the embedded player rather than navigating away.
    $('pane-search').addEventListener('click', event => {
        const link = event.target.closest('a');
        if (!link) return;
        const parsed = parseYouTube(link.getAttribute('data-ctorig') || link.href);
        if (parsed) {
            event.preventDefault();
            event.stopPropagation();
            play(parsed.id, parsed.short);
        }
    }, true);

    function showTab(name) {
        const searchActive = name === 'search';
        $('tab-search').classList.toggle('active', searchActive);
        $('tab-history').classList.toggle('active', !searchActive);
        $('tab-search').setAttribute('aria-selected', String(searchActive));
        $('tab-history').setAttribute('aria-selected', String(!searchActive));
        $('pane-search').classList.toggle('show', searchActive);
        $('pane-history').classList.toggle('show', !searchActive);
        if (side.classList.contains('hidden')) {
            side.classList.remove('hidden');
            refreshControls();
        }
    }
    $('tab-search').addEventListener('click', () => showTab('search'));
    $('tab-history').addEventListener('click', () => showTab('history'));
    $('toggle-side-btn').addEventListener('click', () => {
        side.classList.toggle('hidden');
        refreshControls();
    });
    $('fs-btn').addEventListener('click', async () => {
        try {
            if (!document.fullscreenElement) await playerWrap.requestFullscreen();
            else await document.exitFullscreen();
        } catch (_) {
            setHint('全画面表示を開始できませんでした。ブラウザーの全画面機能を確認してください。');
        }
    });

    function setHint(message) { $('hint').textContent = message; }

    // Restore only the last viewed item; do not autoplay it on page load.
    renderHistories();
    refreshControls();
    const last = load('lastVideo', null);
    if (last && last.id && /^[\w-]{11}$/.test(last.id)) {
        current = { id: last.id, short: last.short === true };
        const base = noCookie ? 'https://www.youtube-nocookie.com/embed/' : 'https://www.youtube.com/embed/';
        const params = new URLSearchParams({ modestbranding: '1', rel: '0', playsinline: '1' });
        frame.src = base + encodeURIComponent(current.id) + '?' + params.toString();
        $('open-link').href = 'https://www.youtube.com/' + (current.short ? 'shorts/' : 'watch?v=') + encodeURIComponent(current.id);
        $('open-link').classList.remove('hidden');
        playerWrap.classList.add('has-video');
        refreshControls();
    }
</script>
</body>
</html>
