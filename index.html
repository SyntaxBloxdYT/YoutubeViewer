<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>YouTube Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
    body { margin: 0; font-family: sans-serif; background: #121212; color: white; display: flex; height: 100vh; overflow: hidden; }
    #main { display: flex; flex: 1; height: 100vh; position: relative; }
    #player-area { flex: 1; display: flex; flex-direction: column; height: 100%; }
    iframe { width: 100%; height: 100%; border: none; background: #000; }
    #search-area { width: 320px; background: #181818; border-left: 1px solid #333; display: flex; flex-direction: column; transition: transform 0.3s; }
    #search-area.hidden { display: none; }
    .controls { padding: 10px; background: #252525; display: flex; gap: 10px; align-items: center; font-size: 13px; }
    .histories { padding: 10px; overflow-y: auto; font-size: 12px; }
</style>
</head>
<body>

<div id="main">
    <div id="player-area">
        <div class="controls">
            <label><input type="checkbox" id="mode-switch"> No-Cookie</label>
            <button onclick="toggleSearch()">検索枠</button>
            <button onclick="clearData()">全履歴削除</button>
        </div>
        <iframe id="video-frame" src="about:blank" allowfullscreen></iframe>
        <div style="font-size:11px; color:#777; padding:5px;">※No-Cookieは広告の挙動が変化する場合があります。</div>
    </div>

    <div id="search-area">
        <div style="padding:10px;"><script async src="https://cse.google.com/cse.js?cx=005510692277321758648:r0nge9ptruy"></script><gcse:searchbox></gcse:searchbox></div>
        <div class="histories" id="history-list"><strong>再生履歴</strong><ul id="list"></ul></div>
    </div>
</div>

<script>
    const frame = document.getElementById('video-frame');
    const modeSwitch = document.getElementById('mode-switch');
    const historyList = document.getElementById('list');

    // 初期化：ストレージから設定読み込み
    modeSwitch.checked = localStorage.getItem('noCookie') === 'true';
    modeSwitch.addEventListener('change', () => localStorage.setItem('noCookie', modeSwitch.checked));

    function toggleSearch() { document.getElementById('search-area').classList.toggle('hidden'); }
    function clearData() { localStorage.removeItem('history'); renderHistory(); }

    function updateVideo(url) {
        const isNoCookie = modeSwitch.checked;
        const base = isNoCookie ? 'https://www.youtube-nocookie.com/embed/' : 'https://www.youtube.com/embed/';
        const v = new URL(url).searchParams.get('v');
        if (v) {
            frame.src = base + v + '?autoplay=1';
            saveHistory(url);
        }
    }

    function saveHistory(url) {
        let h = JSON.parse(localStorage.getItem('history') || '[]');
        h.unshift(url);
        localStorage.setItem('history', JSON.stringify([...new Set(h)].slice(0, 20)));
        renderHistory();
    }

    function renderHistory() {
        historyList.innerHTML = '';
        JSON.parse(localStorage.getItem('history') || '[]').forEach(url => {
            let li = document.createElement('li');
            li.innerHTML = `<a href="#" onclick="updateVideo('${url}'); return false;">${url.split('v=')[1]}</a>`;
            historyList.appendChild(li);
        });
    }

    // CSEのリンクはiframe内にあるため、windowのmessageイベントで親ページに通知させる必要がある
    window.addEventListener('message', e => {
        if (e.data && e.data.url) updateVideo(e.data.url);
    });

    renderHistory();
</script>
</body>
</html>
